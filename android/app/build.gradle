plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'dev.kuugo.frpc'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.kuugo.frpc'
        minSdk 26
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    // The app packages prebuilt Flutter libraries and frpc; it compiles no C/C++.
    // Retain those libraries and avoid Flutter's synthetic NDK download project.
    externalNativeBuild { cmake { path = null } }
    packaging { jniLibs { keepDebugSymbols += ['**/*.so'] } }
    buildTypes {
        release { signingConfig signingConfigs.debug }
    }
}
flutter { source '../..' }

// Optional host LLVM can strip the merged prebuilt libraries without installing
// the full NDK. Never modify Flutter's cached binaries or the downloaded kernel.
def hostStrip = providers.environmentVariable('FRPC_LLVM_STRIP').orNull
if (hostStrip != null) {
    tasks.matching { it.name == 'mergeReleaseNativeLibs' }.configureEach {
        inputs.file(hostStrip).withPropertyName('hostLlvmStrip')
        doLast {
            fileTree(layout.buildDirectory.dir('intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib')) {
                include '**/*.so'
            }.files.each { nativeLibrary ->
                project.exec { commandLine hostStrip, '--strip-unneeded', nativeLibrary.absolutePath }
            }
        }
    }
}
